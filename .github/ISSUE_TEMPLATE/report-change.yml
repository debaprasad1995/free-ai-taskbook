name: Report inaccurate or outdated listing
about: Report a broken link or changed free-plan terms
labels: ["needs verification"]
body:
  - type: input
    id: tool
    attributes:
      label: Tool name or FreeAITaskbook URL
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What has changed?
    validations:
      required: true
  - type: input
    id: official
    attributes:
      label: Official evidence URL
    validations:
      required: true
