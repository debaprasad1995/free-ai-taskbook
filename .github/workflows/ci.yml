name: Validate and build website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax, data, build, and tests
        run: npm run check
      - name: Verify no placeholder affiliate links
        run: node -e "const a=require('./data/affiliates.json'); if(!a.links) process.exit(1)"
