name: Daily resource and government recruitment source review
on:
  schedule:
    # 08:20 India Standard Time; GitHub scheduled runs can start late.
    - cron: '50 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: daily-resource-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check catalog and discovery sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/daily-review.mjs
      - name: Publish owner review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Daily resource review $(date -u +%F)"
          export TITLE
          EXISTING=$(gh issue list --state all --search 'Daily resource review in:title' --json number,title --limit 100 --jq '.[] | select(.title == env.TITLE) | .number' | head -n 1)
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file /tmp/freeaitaskbook/daily-review.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/freeaitaskbook/daily-review.md
          fi
