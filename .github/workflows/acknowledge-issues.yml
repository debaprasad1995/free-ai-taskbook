name: Acknowledge community suggestions
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  acknowledge:
    if: startsWith(github.event.issue.title, 'Tool suggestion:') || startsWith(github.event.issue.title, 'API suggestion:')
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge and prepare maintainer review label
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo, issue_number=context.issue.number;
            for (const label of [
              {name:'new-submission',color:'dbeafe',description:'Community tool or API suggestion awaiting review'},
              {name:'approved-for-publication',color:'0e8a16',description:'Maintainer checked sources and authorized safe publication'}
            ]) {
              try { await github.rest.issues.getLabel({owner,repo,name:label.name}); }
              catch(err){ if(err.status===404){try{await github.rest.issues.createLabel({owner,repo,...label});}catch(e){if(e.status!==422)throw e;}}else throw err; }
            }
            await github.rest.issues.addLabels({owner,repo,issue_number,labels:['new-submission']});
            await github.rest.issues.createComment({owner,repo,issue_number,body:'Thanks for the submission! We will check the official source and access requirements. This is a public issue; please remove any secrets or personal data. A maintainer may apply **approved-for-publication** after reviewing the details, which triggers a validated repository update and Cloudflare deployment. No listing is promised until approved.'});
